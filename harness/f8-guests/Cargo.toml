[workspace]

# ZisK guests on the dot_f8 toolchain. Own workspace: the root workspace pins a
# ziskos without dot_f8. The compute guests use the shared kernel (harness/dotf8)
# through the one syscall backend (src/lib.rs).
[package]
name = "pci-f8-guests"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
pci-dotf8 = { path = "../dotf8" }
pci-layer = { path = "../layer" }
pci-stages = { path = "../client/stages" }
ziskos = { git = "https://github.com/amiabix/zisk", rev = "03acd848bf977086aebbd9beb5ebf0afc13e508c" }

[[bin]]
test = false
name = "layer-batched"
path = "src/bin/layer_batched.rs"

[[bin]]
test = false
name = "layer-perpos"
path = "src/bin/layer_perpos.rs"

[[bin]]
test = false
name = "projection-sample"
path = "src/bin/projection_sample.rs"

[profile.release]
opt-level = 3

[[bin]]
test = false
name = "layer-bindonly"
path = "src/bin/layer_bindonly.rs"

[[bin]]
test = false
name = "head-batched"
path = "src/bin/head_batched.rs"
